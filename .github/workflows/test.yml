name: Test and Chromatic

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Use Node.js 16.x
        uses: actions/setup-node@v1
        with:
          node-version: 16.x

      - name: Install dependencies
        uses: bahmutov/npm-install@v1

      - name: Run Cypress tests
        run: |
          yarn cypress:ci

      - name: Check if chromatic archives exist
        run: |
          if [ -d "cypress/downloads/chromatic-archives" ]; then
            echo "Archives found"
            ls -la cypress/downloads/chromatic-archives/
          else
            echo "No archives directory found"
            mkdir -p cypress/downloads/chromatic-archives
          fi

      - name: Upload chromatic archives
        uses: actions/upload-artifact@v4
        with:
          name: chromatic-archives
          path: cypress/downloads/chromatic-archives
          if-no-files-found: warn

      # - name: Run tests
      #   run: |
      #     yarn test:ci

  chromatic-deployment:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Use Node.js 16.x
        uses: actions/setup-node@v1
        with:
          node-version: 16.x

      - name: Install dependencies
        run: yarn

      - name: Download chromatic archives
        uses: actions/download-artifact@v4
        with:
          name: chromatic-archives
          path: cypress/downloads/chromatic-archives

      - name: Publish to Chromatic
        run: |
          yarn chromatic
        env:
          STORYBOOK_FIGMA_ACCESS_TOKEN: ${{ secrets.STORYBOOK_FIGMA_ACCESS_TOKEN }}
